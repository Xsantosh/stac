name: stac_cli
description: "A CLI tool to convert Dart STAC classes to STAC JSON."
version: 0.0.1
publish_to: none
homepage:

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  args: ^2.4.2
  path: ^1.8.3
  analyzer: ^6.2.0
  glob: ^2.1.2
  # Using path dependencies to reference local packages
  stac:
    path: ../stac
  stac_framework:
    path: ../stac_framework

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

executables:
  stac_cli: stac_cli

# The following section is specific to Flutter packages.
flutter:

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
